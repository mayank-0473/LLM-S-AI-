<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Pipeline Explorer</title>
  <style>
    /* Basic page layout and colors */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1rem;
      color: #94a3b8;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    input[type="text"] {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      color: #f8fafc;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:active {
      transform: scale(0.98);
    }

    .status-card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.75rem;
    }

    .status-box {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #94a3b8;
    }

    .status-highlight {
      color: #38bdf8;
      font-weight: 600;
    }

    .pipeline-stages {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
    }

    .stage-item {
      background-color: #1e293b;
      border: 1px dashed #475569;
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .stage-item .number {
      display: inline-block;
      width: 20px;
      height: 20px;
      line-height: 20px;
      border-radius: 50%;
      background-color: #334155;
      color: #e2e8f0;
      font-size: 0.75rem;
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>LLM Pipeline Explorer</h1>
      <p>A step-by-step visual explorer for Large Language Model processing.</p>
    </header>

    <section class="card input-group">
      <label for="promptInput">Prompt Input</label>
      <div class="input-row">
        <input 
          type="text" 
          id="promptInput" 
          placeholder="Type a sentence here..." 
          value="The quick brown fox jumps over the lazy dog."
        >
        <button id="runBtn">Explore Pipeline</button>
      </div>
    </section>

    <section class="card status-card">
      <h2>Pipeline Status</h2>
      <div id="statusBox" class="status-box">
        Explorer initialized. Click <strong>"Explore Pipeline"</strong> above to test the input.
      </div>

      <div class="pipeline-stages">
        <div class="stage-item">
          <div class="number">1</div>
          <div>Tokenization</div>
        </div>
        <div class="stage-item">
          <div class="number">2</div>
          <div>Embeddings</div>
        </div>
        <div class="stage-item">
          <div class="number">3</div>
          <div>Attention Layers</div>
        </div>
        <div class="stage-item">
          <div class="number">4</div>
          <div>Next Token Output</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // WHAT THIS DOES: Finds the HTML elements on the page (the text box, button, and status display) so our JavaScript code can read and update them.
    const promptInput = document.getElementById('promptInput');
    const runBtn = document.getElementById('runBtn');
    const statusBox = document.getElementById('statusBox');

    // WHAT THIS DOES: Reads what you typed into the input box and updates the status box to confirm that the explorer is active and working.
    function handleExplore() {
      const userText = promptInput.value.trim();

      if (userText === "") {
        statusBox.innerHTML = '<span style="color: #f87171;">⚠️ Please enter some text first!</span>';
        return;
      }

      statusBox.innerHTML = `
        ✅ <strong>Pipeline Loaded!</strong><br>
        Current input: <span class="status-highlight">"${userText}"</span><br>
        Ready for the next pipeline step.
      `;
    }

    // WHAT THIS DOES: Listens for a mouse click on the "Explore Pipeline" button and runs the handleExplore function when clicked.
    runBtn.addEventListener('click', handleExplore);

    // WHAT THIS DOES: Listens for keyboard presses inside the input box so pressing the "Enter" key also triggers the button click.
    promptInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        handleExplore();
      }
    });
  </script>

</body>
</html>
